<title>Estúdio PopDocs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@700&display=swap">
<style>
/* Estúdio PopDocs. App shell: top bar, section rail, working area. Scenes view = timeline + scene list + inspector. */
:root{
  --bg:#F4F2EE; --panel:#FFFFFF; --raise:#F8F6F2; --sunk:#ECE9E3; --line:#DEDAD2; --line2:#C9C4BA;
  --ink:#1B1A17; --muted:#6B675F; --faint:#9A958B;
  --ac:#B8791A; --ac-ink:#FFFFFF; --ac-soft:#F6E9D2; --ok:#2E8B57; --warn:#B26A00; --bad:#C0392B; --bad-soft:#FBE9E6; --ok-soft:#E4F3EA; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(20,18,12,.06),0 8px 24px rgba(20,18,12,.06);
  --display:'Inter Tight','Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:10px; --r2:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1012; --panel:#17191C; --raise:#1E2125; --sunk:#111315; --line:#2A2E33; --line2:#3A3F46;
  --ink:#F0EEE9; --muted:#9BA0A6; --faint:#6A7077;
  --ac:#E8B04A; --ac-ink:#17130A; --ac-soft:#33290F; --ok:#62C48D; --warn:#E7B152; --bad:#EF6B5E; --bad-soft:#3A1B18; --ok-soft:#15301F; --warn-soft:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1012; --panel:#17191C; --raise:#1E2125; --sunk:#111315; --line:#2A2E33; --line2:#3A3F46;
  --ink:#F0EEE9; --muted:#9BA0A6; --faint:#6A7077;
  --ac:#E8B04A; --ac-ink:#17130A; --ac-soft:#33290F; --ok:#62C48D; --warn:#E7B152; --bad:#EF6B5E; --bad-soft:#3A1B18; --ok-soft:#15301F; --warn-soft:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:100vh}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font:800 16px/1 var(--display);letter-spacing:-.2px;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 13px var(--mono);font-style:normal}
.logo small{font:500 11px var(--mono);color:var(--faint);letter-spacing:1px}
.vsel{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:300px;min-width:0;font-weight:600}
.stats{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.stat{font:500 12px var(--mono);color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.stat.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}.stat.warn b{color:var(--warn)}
.stat.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.stat.ok b{color:var(--ok)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--ac);color:var(--ac-ink);border-color:var(--ac);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--raise);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
.icon{padding:7px}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:53px;align-self:start;height:calc(100vh - 53px)}
.rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--muted);font-weight:500;text-align:left}
.rail button:hover{background:var(--raise);color:var(--ink)}
.rail button[aria-selected=true]{background:var(--ac-soft);color:var(--ink);font-weight:600}
.rail button[aria-selected=true] svg{color:var(--ac)}
.rail .badge{margin-left:auto;font:600 11px var(--mono);background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 7px}
.rail .foot{margin-top:auto;font-size:11.5px;color:var(--faint);padding:8px 10px;line-height:1.45}
main{min-width:0;padding:18px max(18px,env(safe-area-inset-right,0px)) 60px 18px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .rail button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;position:relative}.rail .foot{display:none}.rail .badge{position:absolute;top:0;right:0}
  main{padding:14px 16px 96px}.logo small,.stats{display:none}.top{gap:8px}
}
/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h3,.h3{margin:0;font:700 15px var(--display);display:flex;align-items:center;gap:8px}
.card>h3 .sp{flex:1}
.page{display:flex;flex-direction:column;gap:14px;max-width:1180px}
.page>h1{font:800 24px/1.1 var(--display);margin:0 0 2px;letter-spacing:-.4px}
.lead{color:var(--muted);margin:0;max-width:70ch}
.note{font-size:12.5px;color:var(--muted)}
.note.warn{color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
input[type=text],input[type=url],input[type=number],input[type=search],textarea,select{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--ac);outline:0;box-shadow:0 0 0 3px var(--ac-soft)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fields .wide{grid-column:1/-1}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mono);letter-spacing:.3px;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.ac{background:var(--ac-soft);color:var(--ac)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.empty{border:1px dashed var(--line2);border-radius:var(--r2);padding:32px;color:var(--muted);text-align:center}
.noimg{display:grid;place-items:center;font:500 10px var(--mono);color:var(--faint);letter-spacing:1px;background:var(--sunk);text-align:center;padding:4px}
/* timeline */
.tl{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.tl .hd{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--faint)}
.tl .bar{display:flex;gap:1.5px;height:30px}
.tl .bar button{border:0;padding:0;min-width:2px;border-radius:3px;background:var(--line2);opacity:.9}
.tl .bar button.c1{background:color-mix(in srgb,var(--ac) 55%,var(--line2))}
.tl .bar button.cap{background:var(--ink)}
.tl .bar button.dirty{box-shadow:inset 0 -4px 0 var(--warn)}
.tl .bar button:hover{opacity:1;filter:brightness(1.15)}
.tl .bar button[aria-current=true]{background:var(--ac);outline:2px solid var(--ac);outline-offset:1px}
.tl .mus{display:flex;gap:1.5px;height:8px}
.tl .mus i{border-radius:3px;background:color-mix(in srgb,var(--ok) 60%,var(--panel));min-width:2px}
.tl .mus i:nth-child(even){background:color-mix(in srgb,var(--ok) 28%,var(--panel))}
.tl .caps{display:flex;gap:1.5px;font:500 10.5px var(--mono);color:var(--muted)}
.tl .caps span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
/* scenes desk */
.desk{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start;margin-top:14px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;position:sticky;top:67px;max-height:calc(100vh - 81px);min-height:0}
.list .tools{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.list .scroll{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.grp{font:600 11px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);padding:10px 8px 4px;display:flex;justify-content:space-between;gap:8px}
.sc{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;background:none;border:1px solid transparent;border-radius:9px;padding:5px;text-align:left;width:100%;align-items:center}
.sc:hover{background:var(--raise)}
.sc[aria-current=true]{background:var(--ac-soft);border-color:color-mix(in srgb,var(--ac) 50%,transparent)}
.sc img,.sc .noimg{width:76px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;display:block}
.sc .row1{display:flex;gap:6px;align-items:center;font:500 11px var(--mono);color:var(--faint)}
.sc .num{color:var(--ink);font-weight:600}
.sc .txt{font-size:12.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.insp{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.hero img,.hero .noimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;display:block}
.hero h2{font:800 22px/1.15 var(--display);margin:4px 0 8px;letter-spacing:-.3px;text-wrap:balance}
.kicker{font:500 11.5px var(--mono);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts{display:flex;flex-wrap:wrap;gap:6px}
textarea.narr{min-height:120px;font-size:15px;line-height:1.55}
.under{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.under audio{height:32px;max-width:300px}
.pairs{display:flex;flex-direction:column;gap:6px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:6px}
@media (max-width:900px){.desk{grid-template-columns:minmax(0,1fr)}.list{position:static;max-height:44vh}.hero{grid-template-columns:minmax(0,1fr)}}
/* media */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.foto{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.foto:hover{border-color:var(--line2)}
.foto[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-soft)}
.foto img,.foto video,.foto .noimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.foto .cap{padding:7px 9px 3px;font-size:12px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.foto .lic{padding:0 9px 8px;font:10.5px var(--mono);color:var(--faint);display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mediagrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.mediagrid .side{position:sticky;top:67px}
@media (max-width:1100px){.mediagrid{grid-template-columns:minmax(0,1fr)}.mediagrid .side{position:static;order:-1}}
/* framing */
.frm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.frm figure{margin:0;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted)}
.frm .out{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.frm .out img{position:absolute;inset:0;width:100%;height:100%}
.frm .out img.back{object-fit:cover;filter:blur(14px) brightness(.45);transform:scale(1.2)}
.frm .map{position:relative;border-radius:8px;overflow:hidden;cursor:crosshair;background:var(--sunk);display:flex;justify-content:center}
.frm .map img{display:block;max-width:100%;max-height:220px}
.frm .map b{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
@media (max-width:560px){.frm{grid-template-columns:minmax(0,1fr)}}
/* transitions */
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kind{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.kind[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-soft)}
.kind video,.kind .noimg{width:100%;aspect-ratio:16/9;background:#000;display:block;object-fit:cover}
.kind .nm{padding:6px 8px;font-size:12px}
.kgrp{font:600 11px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin:8px 0 6px}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--ac)}
.range output{font:500 12px var(--mono);min-width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
/* style */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500}
.pal[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-soft)}
.mock{--mb:#0B0B0B;--mf:#F2F2F2;--ma:#F2F2F2;--mp:#EDEDED;position:relative;width:100%;aspect-ratio:16/9;background:var(--mb);color:var(--mf);border-radius:6px;overflow:hidden;container-type:inline-size;font-family:var(--mono)}
.mock .mk{position:absolute;left:6%;top:14%;font-size:2.6cqw;letter-spacing:.6cqw;color:color-mix(in srgb,var(--ma) 60%,var(--mb))}
.mock .mg{position:absolute;left:6%;top:22%;font:700 13cqw/1 'Oswald',var(--display);text-transform:uppercase}
.mock .ms{position:absolute;left:6%;top:52%;width:50%;font-size:2.9cqw;line-height:1.4;color:color-mix(in srgb,var(--mf) 78%,var(--mb))}
.mock .mt{position:absolute;left:6%;bottom:9%;font-size:2.3cqw;letter-spacing:.3cqw;background:var(--ma);color:var(--mb);padding:.6cqw 1.4cqw}
.mock .mp{position:absolute;right:5%;top:22%;width:33%;background:var(--mp);color:#111;padding:2.4cqw;transform:rotate(-2deg);font:700 3.2cqw/1.2 Georgia,serif}
.mock .mp span{background:color-mix(in srgb,var(--ma) 45%,#B5B5B5)}
.mock .mph{position:absolute;right:6%;bottom:9%;width:22%;aspect-ratio:4/3;border-radius:2px}
.color{display:flex;gap:6px;align-items:center}
.color input[type=color]{width:44px;height:38px;padding:2px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;flex:none}
/* music */
.track{display:grid;grid-template-columns:28px minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--raise)}
.track .n{font:600 13px var(--mono);color:var(--ac);align-self:center}
@media (max-width:900px){.track{grid-template-columns:minmax(0,1fr)}}
/* publish */
.check{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:11px 2px;border-top:1px solid var(--line);align-items:start}
.ck:first-child{border-top:0}
.ck .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);margin-top:1px}
.ck.ok .st{background:var(--ok-soft);color:var(--ok)}.ck.warn .st{background:var(--warn-soft);color:var(--warn)}.ck.bad .st{background:var(--bad-soft);color:var(--bad)}
.ck b{display:block;font-weight:600}
.ck span{color:var(--muted);font-size:12.5px}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.out{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--raise)}
.out:hover{border-color:var(--ac)}
.out small{font:11.5px var(--mono);color:var(--muted)}
.rmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rmode{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--raise)}
.rmode b{font:700 14px var(--display)}
.rmode p{margin:0;font-size:12.5px;color:var(--muted);flex:1}
pre.mono{font:12px/1.55 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;white-space:pre-wrap;max-height:240px;overflow:auto}
/* overlays */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:60;box-shadow:var(--shadow)}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .in{padding:20px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font:800 19px var(--display)}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--faint)}
.step i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);flex:none}
.step.feito{color:var(--ink)}.step.feito i{background:var(--ok);border-color:var(--ok)}
.step.agora{color:var(--ink);font-weight:600}.step.agora i{border-color:var(--ac);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pbar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}.pbar i{display:block;height:100%;background:var(--ac);transition:width .4s}
#rpill{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="logo"><i>PD</i>Estúdio <small>POPDOCS</small></div>
    <select class="vsel" id="vsel" aria-label="Vídeo"></select>
    <div class="stats" id="stats"></div>

async function save(ref,data,msg='Salvo'){

/* ---------- top bar ---------- */
function stats(){
  const T=timing(), L=T.items, dirty=st.scenes.filter(s=>s.dirty&&!s.deleted).length, x=extra();
  let h=`<span class="stat">cenas <b>${L.length}</b></span><span class="stat">duração <b>${T.real?'':'≈ '}${fmt(T.total)}</b></span>`;

}

/* ---------- scenes ---------- */
function timeline(){
  const T=timing(); if(!T.items.length) return '';
  let ci=-1; const bar=T.items.map((o,i)=>{if(o.s.t==='chapter')ci++;return `<button style="flex:${o.len.toFixed(2)}" class="${o.s.t==='chapter'?'cap':ci%2?'':'c1'}${o.s.dirty?' dirty':''}" data-go="${esc(o.s.id)}" aria-current="${o.s.id===st.sel}" title="${String(i+1).padStart(2,'0')} · ${esc(TYPES[o.s.t]||o.s.t)} · ${fmt(o.start)} · ${esc(firstText(o.s).slice(0,70))}" aria-label="Cena ${i+1}"></button>`}).join('');
  const G=chapters(T.items.map(o=>o.s)); const caps=G.map(g=>{const len=g.items.reduce((a,[s])=>a+est(s),0);return `<span style="flex:${len.toFixed(2)}">${esc(g.num?g.num+' · ':'')}${esc(g.name)}</span>`}).join('');
  const S=segs(); let mus='';
  if(S.length>1||S[0].file){const starts=S.map(x=>T.items[Math.max(0,(x.cena||1)-1)]?.start||0);mus=`<div class="mus" title="Trechos de música">${S.map((x,k)=>`<i style="flex:${Math.max(.01,((starts[k+1]??T.total)-starts[k])).toFixed(2)}" title="${esc((x.file||'').replace('musica/',''))}"></i>`).join('')}</div>`}
  return `<div class="tl" id="tl"><div class="hd"><span>0:00</span><span>Linha do tempo · clique para abrir uma cena${T.real?'':' · duração estimada até a primeira renderização'}</span><span>${fmt(T.total)}</span></div><div class="bar">${bar}</div>${mus}<div class="caps">${caps}</div></div>`;
}
function sceneMatch(s){
  if(st.q&&!JSON.stringify([s.n,s.f,s.bg]).toLowerCase().includes(st.q.toLowerCase())) return false;
  return st.filt==='todas'||(st.filt==='alteradas'&&s.dirty)||(st.filt==='semfoto'&&!s.bg)||(st.filt==='semvoz'&&s.n&&extra()&&!s.audio);
}
function listHtml(){
  const L=live(), T=timing(), G=chapters(L), del=st.scenes.filter(s=>s.deleted); let h='';
  G.forEach(g=>{const it=g.items.filter(([s])=>sceneMatch(s)); if(!it.length) return;
    h+=`<div class="grp"><span>${esc(g.num?'Cap. '+g.num+' · ':'')}${esc(g.name)}</span><span>${fmt(g.items.reduce((a,[s])=>a+est(s),0))}</span></div>`;
    it.forEach(([s,i])=>{h+=`<button class="sc" data-id="${esc(s.id)}" aria-current="${s.id===st.sel}">${thumbOf(s)}<div><div class="row1"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(TYPES[s.t]||s.t)}</span><span>${fmt(T.items[i].start)}</span>${s.dirty?'<i class="dot" title="Alterada depois da última renderização"></i>':''}</div><div class="txt">${esc(firstText(s))}</div></div></button>`})});
  if(del.length) h+=`<div class="grp"><span>Removidas</span></div>`+del.map(s=>`<button class="btn sm" data-restore="${esc(s.id)}">Restaurar “${esc(firstText(s).slice(0,26))}…”</button>`).join('');
  return h||'<div class="note" style="padding:14px">Nenhuma cena com este filtro.</div>';
}
function framing(k,f,scope){ // scope: 'foto' (library) or 'cena' (override in the current scene)
  if(!f||!f.thumb||f.thumbKind==='video') return '';
  const s=scope==='cena'?cur():null, sf=s&&s.f||{}, own=!!(s&&(sf.foco||sf.enquadrar));
  const enq=own?sf.enquadrar:f.enquadrar, fo=(own?sf.foco:f.foco)||[.5,.5], whole=enq==='inteira', src=esc(f.thumb);
  return `<div class="frm" data-frm="${esc(k)}" data-scope="${scope}">
   <figure><div class="out">${whole?`<img class="back" src="${src}" alt=""><img src="${src}" alt="" style="object-fit:contain;object-position:${fo[0]*100}% 50%">`:`<img src="${src}" alt="" style="object-fit:cover;object-position:${fo[0]*100}% ${fo[1]*100}%">`}</div>Como aparece no vídeo (o movimento de câmera entra na renderização)</figure>
   <figure><div class="map" data-map="1"><img src="${src}" alt="Foto inteira. Clique no ponto que deve ficar visível."><b style="left:${fo[0]*100}%;top:${fo[1]*100}%"></b></div>Clique no ponto da foto que deve ficar visível</figure></div>

   ${scope==='cena'?`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-own ${own?'checked':''}> Só nesta cena</label>`:''}
   <button class="btn sm ghost" data-frmreset>Voltar ao centro</button>${f.recorte?'<span class="chip">com recorte</span>':''}</div>`;
}
function media(f){return f.thumb?(f.thumbKind==='video'?`<video src="${esc(f.thumb)}#t=0.5" muted playsinline preload="metadata"></video>`:`<img src="${esc(f.thumb)}" alt="" loading="lazy">`):'<div class="noimg">AGUARDANDO DOWNLOAD</div>'}
function fotoCard(k,f,pressed,u){const miss=!f.credit||!f.license;return `<button class="foto" data-foto="${esc(k)}" aria-pressed="${pressed}">${media(f)}<div class="cap">${esc(f.cap||k)}</div><div class="lic">${f.tipo==='video'?'<span class="chip ac">vídeo</span>':''}${u?`<span class="chip">${u.length}× em cena</span>`:''}${miss?'<span class="chip bad">sem crédito</span>':esc(f.license||'')}</div></button>`}
function fieldInput(key,val){
  const lab=FIELD[key]||key;

}
function cur(){const L=live();return L.find(x=>x.id===st.sel)||L[0]}

  h+=`<div class="card"><h3>Narração<span class="sp"></span><span class="chip" id="ncount">${(s.n||'').length} caracteres</span></h3><textarea class="narr" id="narr" aria-label="Narração">${esc(s.n||'')}</textarea>

/* Framing clicks, shared by the scene inspector and the media library. Returns true when it handled the event. */
async function frmClick(e){

  const map=e.target.closest('[data-map]'), enq=e.target.closest('[data-enq]'), rst=e.target.closest('[data-frmreset]'); if(!map&&!enq&&!rst) return false;
  const k=box.dataset.frm, lib=st.fotos[k]||{}, s=box.dataset.scope==='cena'?cur():null, own=s&&((s.f||{}).foco||(s.f||{}).enquadrar!==undefined&&(s.f||{}).enquadrar!==null&&'enquadrar' in (s.f||{}));

  if(map){const im=map.querySelector('img').getBoundingClientRect(); nv.foco=[+Math.min(1,Math.max(0,(e.clientX-im.left)/im.width)).toFixed(3),+Math.min(1,Math.max(0,(e.clientY-im.top)/im.height)).toFixed(3)]}
  if(enq) nv.enquadrar=enq.dataset.enq;

  else {const d={enquadrar:nv.enquadrar,foco:(nv.foco[0]===.5&&nv.foco[1]===.5)?'':nv.foco}; st.fotos[k]={...lib,...d}; await save(`${vref()}/fotos/${k}`,d,'Enquadramento salvo')}

}
async function sceneAct(a,s){

    await save(sceneRef(s),{order:oo},''); await save(sceneRef(o),{order:so},'Cena movida'); s.order=oo;o.order=so; viewCenas(); return}
  if(a==='del'){const n=L[k+1]||L[k-1]; st.sel=n&&n.id; await save(sceneRef(s),{deleted:true},'Cena removida (dá para restaurar no fim da lista)'); return}

  M.innerHTML=`<div class="page"><h1>Estilo</h1><p class="lead">O que vale para o vídeo inteiro: cores, transições, textos fixos e thumbnail.</p>
   <div class="card"><h3>Cores<span class="sp"></span><span class="chip ac">${esc(palOf(c)||'Personalizada')}</span></h3><div class="note">Compare as paletas lado a lado e clique para aplicar. Mudar a paleta redesenha todas as cenas na próxima renderização, sem gastar créditos de narração. A sépia foi a escolhida no Diesel.</div>
    <div class="pals" id="pals">${Object.entries(PALETAS).map(([n,p])=>`<button class="pal" data-pal="${esc(n)}" aria-pressed="${palOf(c)===n}">${mock(p)}<span>${esc(n)}</span></button>`).join('')}</div>
    <details><summary class="note" style="cursor:pointer">Ajustar cores à mão</summary><div class="fields" id="cf" style="margin-top:10px">${CFIELDS.map(([k,l])=>`<label class="f">${esc(l)}<span class="color"><input type="color" data-c="${k}" value="${esc(c[k])}" aria-label="${esc(l)}"><input type="text" data-ch="${k}" value="${esc(c[k])}" maxlength="7" aria-label="${esc(l)} em hexadecimal"></span></label>`).join('')}
     <label class="f">Fotos<select data-c="fotos">${FOTOMODOS.map(([k,l])=>`<option value="${k}" ${c.fotos===k?'selected':''}>${esc(l)}</option>`).join('')}</select></label></div></details></div>
   <div class="card"><h3>Modelo de transições</h3><div class="note">Aplica uma regra a todas as passagens de cena de uma vez. Depois você ainda pode trocar cada uma em Cenas. Hoje: ${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${n}× ${(KINDS[k]||{l:k}).l.toLowerCase()}`).join(', ')||'nenhuma'}.</div>
    <div class="rmodes">${Object.entries(PRESETS).map(([id,p])=>`<div class="rmode"><b>${esc(p.l)}</b><p>${esc(p.d)}</p><button class="btn sm" data-preset="${id}">Aplicar a todas</button></div>`).join('')}</div></div>
   <div class="card"><h3>Textos fixos</h3><div class="fields" id="vf">${VFIELDS.map(([k,l])=>{const long=String(v[k]||'').length>60||k==='endCredits'||k==='endNote';return `<label class="f ${long?'wide':''}">${esc(l)}${long?`<textarea data-v="${k}">${esc(v[k]||'')}</textarea>`:`<input type="text" data-v="${k}" value="${esc(v[k]||'')}">`}</label>`}).join('')}</div><div class="note">Mudar os créditos ou a nota final refaz só a cena de encerramento.</div></div>
   <div class="card"><h3>Thumbnail</h3><div class="hero">${v.thumbUrl?`<img src="${esc(v.thumbUrl)}" alt="Thumbnail atual">`:'<div class="noimg">A THUMBNAIL APARECE DEPOIS DA RENDERIZAÇÃO</div>'}<div class="fields" id="tf">${TFIELDS.map(([k,l])=>`<label class="f">${esc(l)}<input type="text" data-t="${k}" value="${esc(th[k]||'')}" ${k==='photo'?'list="fotokeys"':''}></label>`).join('')}<datalist id="fotokeys">${Object.keys(st.fotos).sort().map(k=>`<option value="${esc(k)}">`).join('')}</datalist></div></div></div>
   <div class="card"><h3>Voz</h3><div class="under"><span class="chip">${esc(v.voice_name||v.voice_id||'não definida')}</span><span>${esc(v.voice_model||'')}</span></div><div class="note">A voz é definida no video.json. Trocar de voz gera todos os áudios de novo (cerca de ${nf((extra()||{narr:{total:live().reduce((a,s)=>a+(s.n||'').length,0)}}).narr.total)} créditos), então decida antes com a versão de teste.</div></div></div>`;
  const setC=(c2,msg)=>{st.video={...st.video,cores:c2};later('c',()=>save(vref(),{cores:c2},msg||'Cores salvas'),300)};
  M.onclick=async e=>{const b=e.target.closest('[data-pal]'); if(b){await save(vref(),{cores:{...PALETAS[b.dataset.pal]}},'Paleta: '+b.dataset.pal); st.video={...st.video,cores:{...PALETAS[b.dataset.pal]}}; viewEstilo(); return}
    const p=e.target.closest('[data-preset]'); if(p) ask(`Aplicar o modelo “${PRESETS[p.dataset.preset].l}”?`,`As ${L.length-1} transições deste vídeo serão trocadas. As cenas não são redesenhadas, só as passagens.`,'Aplicar',()=>applyPreset(p.dataset.preset))};
  M.onchange=null;
  M.oninput=e=>{const i=e.target;
    if(i.dataset.v){later('v',()=>{const d={};$$('#vf [data-v]').forEach(x=>d[x.dataset.v]=x.value);st.video={...st.video,...d};save(vref(),d)});return}
    if(i.dataset.t){later('t',()=>{const d={...(st.video.thumb||{})};$$('#tf [data-t]').forEach(x=>d[x.dataset.t]=x.value);save(vref(),{thumb:d})});return}
    const k=i.dataset.c||i.dataset.ch; if(!k) return; let val=i.value.trim();
    if(i.dataset.ch){ if(!/^#[0-9a-fA-F]{6}$/.test(val)) return; $(`#cf [data-c="${k}"]`).value=val.toLowerCase() } else if(k!=='fotos') $(`#cf [data-ch="${k}"]`).value=val.toUpperCase();
    setC({...cores(),[k]:k==='fotos'?val:val.toUpperCase()})};
}
async function applyPreset(id){const L=live(), f=PRESETS[id].f; let n=0;
  for(let i=0;i<L.length-1;i++){const [kind,dur]=f(L[i].t,L[i+1].t), o=L[i].trans||{}; if(o.kind===kind&&(o.dur??KINDS[kind].d)===dur) continue; L[i].trans={kind,dur,params:{}}; await save(sceneRef(L[i]),{trans:L[i].trans},''); n++}
  toast(n?`${n} transições trocadas`:'Já estava neste modelo'); viewEstilo()}

/* ---------- publish ---------- */
function problems(){
  const v=st.video||{}, x=extra(), L=live(), u=usage(), P=[], ck=v.checagem||{};
  if(!ck.ok) P.push({id:'checagem',lv:x&&x.narr.pendentes?'bad':'warn',t:'Checagem frase a frase pendente',d:ck.url?'A planilha está ligada, mas ainda não foi marcada como conferida.':'Regra do canal: todo roteiro passa pela planilha de checagem antes de gerar a voz.'});
  if(x&&x.narr.pendentes) P.push({id:'voz',lv:'warn',t:`${nf(x.narr.pendentes)} caracteres de narração ainda sem áudio`,d:`${x.narr.cenas} cenas. Gerar gasta cerca de ${nf(x.narr.pendentes)} créditos da ElevenLabs. Use a versão de teste antes.`});
  const semc=Object.keys(u).filter(k=>st.fotos[k]&&(!st.fotos[k].credit||!st.fotos[k].license)); if(semc.length) P.push({id:'credito',lv:'bad',t:`${semc.length} foto(s) em cena sem crédito ou licença`,d:semc.slice(0,8).join(', ')});
  const falt=Object.keys(u).filter(k=>!st.fotos[k]||!st.fotos[k].thumb); if(falt.length) P.push({id:'faltam',lv:'bad',t:`${falt.length} fundo(s) usados em cena ainda não baixados`,d:falt.slice(0,8).join(', ')});
  const dirty=st.scenes.filter(s=>s.dirty&&!s.deleted).length;
  if(x&&!x.saidas.video) P.push({id:'render',lv:'warn',t:'O vídeo final ainda não foi renderizado',d:'Faça primeiro a versão de teste, confira, e só então a final.'});
  else if(dirty) P.push({id:'render',lv:'warn',t:`${dirty} cena(s) mudaram depois da última renderização`,d:'Renderize de novo para o vídeo refletir as edições. Só o que mudou é refeito.'});
  if(x&&!x.youtube) P.push({id:'youtube',lv:'warn',t:'Falta o texto do YouTube',d:'Título, descrição com fontes e créditos, e capítulos.'});
  return P;
}
function capitulos(){const T=timing();return T.items.filter((o,i)=>i===0||o.s.t==='chapter').map((o,i)=>`${fmt(i===0?0:o.start)} ${i===0?'Abertura':((o.s.f||{}).name||'Capítulo')}`).join('\n')}
function viewPublicar(){
  const v=st.video||{}, x=extra(), P=problems(), ck=v.checagem||{}, T=timing();
  const okItems=[!P.some(p=>p.id==='checagem')&&['Checagem conferida','Roteiro conferido frase a frase.'],x&&!x.narr.pendentes&&['Narração pronta',`${nf(x.narr.total)} caracteres com áudio gerado.`],!P.some(p=>p.id==='credito')&&['Créditos e licenças','Todas as fotos em cena têm crédito e licença.'],x&&x.saidas.video&&!P.some(p=>p.id==='render')&&['Vídeo renderizado','O vídeo final está em dia com as edições.']].filter(Boolean);
  const names={video:'Vídeo final',teste:'Versão de teste',celular:'Cópia para celular',legendas:'Legendas (.srt)',thumbnail:'Thumbnail'};
  M.innerHTML=`<div class="page"><h1>Publicar</h1><p class="lead">O caminho até o YouTube: conferir, testar com voz grátis, gerar a voz de verdade e levar os arquivos.</p>
   <div class="card"><h3>Pronto para publicar?<span class="sp"></span><span class="chip ${P.length?'warn':'ok'}">${P.length?P.length+' pendência(s)':'tudo certo'}</span></h3><div class="check">${P.map(p=>`<div class="ck ${p.lv}"><div class="st">!</div><div><b>${esc(p.t)}</b><span>${esc(p.d)}</span></div></div>`).join('')}${okItems.map(([t,d])=>`<div class="ck ok"><div class="st">✓</div><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}</div></div>
   <div class="card"><h3>Checagem do roteiro</h3><div class="fields"><label class="f wide">Link da planilha de checagem frase a frase<input type="url" id="ckurl" value="${esc(ck.url||'')}" placeholder="https://…"></label></div>
    <div class="under"><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:500"><input type="checkbox" id="ckok" ${ck.ok?'checked':''}> Conferi frase por frase e o roteiro está aprovado</label>${ck.url?`<a href="${esc(ck.url)}" target="_blank" rel="noopener">Abrir a planilha</a>`:''}${ck.em?`<span>marcado em ${esc(new Date(ck.em).toLocaleDateString('pt-BR'))}</span>`:''}</div></div>
   <div class="card"><h3>Renderizar</h3>${LOCAL?`<div class="rmodes">
     <div class="rmode"><b>1 · Versão de teste</b><p>Voz sintética grátis, sem gastar créditos. Serve para conferir ritmo, fotos, música e transições. Sai como ${esc(st.slug)}-TESTE.mp4.</p><button class="btn" data-render="teste">Gerar versão de teste</button></div>
     <div class="rmode"><b>2 · Vídeo final</b><p>Voz da ElevenLabs. ${x&&x.narr.pendentes?`Vai gerar ${nf(x.narr.pendentes)} caracteres de narração (cerca de ${nf(x.narr.pendentes)} créditos).`:'A narração já está pronta: não gasta créditos.'} Só refaz o que mudou.</p><button class="btn primary" data-render="final">Renderizar vídeo final</button></div>
     <div class="rmode"><b>3 · Cópia para celular</b><p>Versão leve em 540p do vídeo final, para ver no telefone ou mandar por mensagem.</p><button class="btn" data-render="celular" ${x&&x.saidas.video?'':'disabled'}>Gerar cópia leve</button></div></div>`:`<div class="note">Aqui na nuvem, o botão no topo marca o vídeo para renderizar e o Claude faz o resto. No Estúdio local você tem versão de teste com voz grátis, vídeo final e cópia para celular.</div>`}</div>
   ${x?`<div class="card"><h3>Arquivos prontos</h3>${Object.keys(x.saidas).length?`<div class="outs">${Object.entries(x.saidas).map(([k,o])=>`<a class="out" href="${esc(o.url)}" target="_blank" rel="noopener"><b>${names[k]||k}</b><small>${o.mb} MB · ${esc(new Date(o.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))}</small></a>`).join('')}</div>`:'<div class="note">Nada renderizado ainda.</div>'}<div class="note">Pasta no computador: ${esc(x.pasta)}${/[\\/]$/.test(x.pasta)?'':'/'}saidas. No YouTube, marque “conteúdo alterado ou sintético”, porque a narração é gerada por IA.</div></div>`:''}
   <div class="cols"><div class="card"><h3>Texto do YouTube<span class="sp"></span><button class="btn sm" data-copy="yt">Copiar</button></h3><textarea id="yt" style="min-height:280px;font:12.5px/1.55 var(--mono)" ${x?'':'readonly'} placeholder="Título, descrição, fontes, créditos…">${esc(x?x.youtube:'')}</textarea><div class="note">${x?`Salvo em youtube-${esc(st.slug)}.txt na pasta do vídeo.`:'Disponível no Estúdio local.'}</div></div>
   <div class="card"><h3>Capítulos<span class="sp"></span><button class="btn sm" data-copy="caps">Copiar</button></h3><pre class="mono" id="caps">${esc(capitulos())}</pre><div class="note">${T.real?'Tempos da última renderização.':'Tempos estimados. Ficam exatos depois de renderizar.'} Cole na descrição para o YouTube criar os capítulos.</div></div></div></div>`;
  const putCk=d=>{const c={...(st.video.checagem||{}),...d}; st.video={...st.video,checagem:c}; return save(vref(),{checagem:c},'Checagem salva')};
  M.oninput=e=>{ if(e.target.id==='ckurl') later('ck',()=>putCk({url:e.target.value.trim()})); if(e.target.id==='yt'&&LOCAL) later('yt',async()=>{try{await LOCAL.youtube(st.slug,e.target.value);st.video.local.youtube=e.target.value;toast('Texto do YouTube salvo');stats()}catch(err){toast('Não salvou: '+err.message)}},900) };
  M.onchange=async e=>{ if(e.target.id==='ckok'){await putCk({ok:e.target.checked,em:e.target.checked?new Date().toISOString():''}); viewPublicar(); stats()} };
  M.onclick=e=>{const c=e.target.closest('[data-copy]'); if(c){const el=$('#'+c.dataset.copy); navigator.clipboard.writeText(el.value??el.textContent).then(()=>toast('Copiado'),()=>toast('Não consegui copiar'));return}
    const r=e.target.closest('[data-render]'); if(r) askRender(r.dataset.render)};
}

/* ---------- render ---------- */
function ask(title,text,okLabel,fn,danger){const d=$('#dlg'); d.innerHTML=`<div class="in"><h2>${esc(title)}</h2><div style="color:var(--muted)">${text}</div><div class="foot"><button class="btn" data-x>Cancelar</button><button class="btn ${danger?'':'primary'}" data-ok>${esc(okLabel)}</button></div></div>`;
  d.onclick=e=>{if(e.target.closest('[data-x]'))d.close(); if(e.target.closest('[data-ok]')){d.close();fn()}}; d.showModal()}
function askRender(modo){
  const x=extra(), ck=(st.video.checagem||{}).ok;
  if(modo==='final'&&x&&x.narr.pendentes) return ask('Gerar a voz e renderizar o vídeo final?',`Isto vai gerar <b>${nf(x.narr.pendentes)} caracteres</b> de narração na ElevenLabs (cerca de ${nf(x.narr.pendentes)} créditos), em ${x.narr.cenas} cenas.${ck?'':'<br><br><b style="color:var(--bad)">A checagem frase a frase ainda não está marcada como conferida.</b> O recomendado é conferir e fazer a versão de teste antes.'}`,ck?'Gerar voz e renderizar':'Gerar mesmo assim',()=>startRender(modo),!ck);
  startRender(modo);
}
async function startRender(modo){
  if(!LOCAL){await save(vref(),{render:{...(st.video.render||{}),requested:true,requestedAt:new Date().toISOString()}},'Marcado. Agora escreva "renderiza" no chat.');return}
  try{const r=await LOCAL.render(st.slug,modo); if(!r.iniciado) toast('Já existe uma renderização em andamento'); st.job={slug:st.slug,open:true}; stats(); poll()}catch(e){toast('Não começou: '+(e.message||'erro'))}
}
const MODO={final:'Vídeo final',teste:'Versão de teste',celular:'Cópia para celular'};
async function poll(){
  const j=st.job; if(!j) return; let r; try{r=await LOCAL.status(j.slug)}catch(e){return setTimeout(poll,4000)}
  if(!r.passos){st.job=null;stats();return}
  const done=r.passos.filter(p=>p.estado==='feito').length, pct=r.running?Math.round(100*(done+.5)/Math.max(1,r.passos.length)):100, el=fmt(r.elapsed), pill=$('#rpill');
  pill.style.display='inline-flex'; pill.innerHTML=r.running?`<span class="step agora" style="font-size:12.5px"><i></i>${esc(MODO[r.modo])} · ${pct}% · ${el}</span>`:r.ok?'✓ Renderização pronta':r.cancelado?'Renderização cancelada':'A renderização parou com erro';
  pill.onclick=()=>{j.open=true;poll.draw()};
  poll.draw=()=>{const d=$('#dlg'); if(!j.open){return} const cur=r.passos.find(p=>p.estado==='agora');
    d.innerHTML=`<div class="in"><h2>${r.running?esc(MODO[r.modo])+': '+esc(cur?cur.nome.toLowerCase():'começando')+'…':r.ok?esc(MODO[r.modo])+' pronto em '+el:r.cancelado?'Renderização cancelada':'A renderização parou com erro'}</h2>
     ${r.running?`<div class="pbar"><i style="width:${pct}%"></i></div><div class="note">Tempo: ${el}. A primeira vez leva de 20 a 40 minutos; depois só o que mudou é refeito. Pode fechar esta janela e continuar editando.</div>`:''}
     <div class="steps">${r.passos.map(p=>`<div class="step ${p.estado}"><i></i>${esc(p.nome)}</div>`).join('')}</div>
     ${r.ok&&r.video?`<video controls src="${esc(r.video)}" style="width:100%;border-radius:10px;background:#000"></video>`:''}
     <details ${!r.running&&!r.ok&&!r.cancelado?'open':''}><summary class="note" style="cursor:pointer">Detalhes técnicos</summary><pre class="mono" style="margin-top:8px">${esc(r.log||'')}</pre></details>
     <div class="foot">${r.running?'<button class="btn danger" data-cancel>Cancelar renderização</button>':''}${r.ok&&r.video?`<a class="btn" href="${esc(r.video)}" target="_blank" rel="noopener">Abrir em outra aba</a>`:''}<button class="btn primary" data-x>${r.running?'Continuar editando':'Fechar'}</button></div></div>`;
    d.onclick=async e=>{if(e.target.closest('[data-x]')){j.open=false;d.close()} if(e.target.closest('[data-cancel]')){await LOCAL.cancel(j.slug);toast('Cancelando…')}};
    if(!d.open)d.showModal()};
  if(j.open&&!(r.running&&$('#dlg').open&&$('#dlg details')?.open)) poll.draw();
  if(r.running) return setTimeout(poll,2500);
  st.job=null; setTimeout(()=>{if(!st.job)pill.style.display='none'},15000); try{await LOCAL.reload(j.slug)}catch(e){} stats();
}

/* ---------- shell ---------- */
const VIEWS={cenas:viewCenas,midia:viewMidia,musica:viewMusica,estilo:viewEstilo,publicar:viewPublicar};
function view(){ stats();
  if(!st.video){M.innerHTML='<div class="empty">Nenhum vídeo no arquivo ainda. Peça ao Claude para criar o primeiro dossiê.</div>';return}
  VIEWS[st.tab](); }
const editing=()=>{const a=document.activeElement; return a&&M.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='range'};
function refresh(){ if(!editing()) return view(); stats(); if(st.tab==='cenas'&&$('#scroll')){const sc=$('#scroll').scrollTop;$('#scroll').innerHTML=listHtml();$('#scroll').scrollTop=sc} }
$('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(!b) return; st.tab=b.dataset.tab; st.picker=false; view(); scrollTo(0,0)});
$('#vsel').addEventListener('change',e=>openVideo(e.target.value));
$('#renderBtn').addEventListener('click',()=>{ if(LOCAL){st.tab='publicar';view();scrollTo(0,0)} else startRender('final') });
$('#themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches; document.documentElement.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('popdocs-tema',document.documentElement.dataset.theme)}catch(e){}});
try{const t=localStorage.getItem('popdocs-tema'); if(t) document.documentElement.dataset.theme=t}catch(e){}
document.addEventListener('keydown',e=>{ if(st.tab!=='cenas'||e.metaKey||e.ctrlKey||e.altKey||$('#dlg').open) return; const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();sceneAct('next',cur())} if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();sceneAct('prev',cur())} });
window.addEventListener('popdocs-erro',e=>toast(e.detail));
function openVideo(slug){
  st.unsub.forEach(u=>u()); st.unsub=[]; st.slug=slug; st.sel=null; st.msel=null; st.scenes=[]; st.fotos={}; st.q=''; st.filt='todas';
  try{localStorage.setItem('popdocs-video',slug)}catch(e){}
  st.unsub.push(db.doc(`videos/${slug}`).onSnapshot(sn=>{st.video=sn.exists?{id:sn.id,...sn.data()}:null; refresh()}));
  st.unsub.push(db.collection(`videos/${slug}/scenes`).onSnapshot(q=>{st.scenes=q.docs.map(d=>({id:d.id,...d.data()})); refresh()}));
  st.unsub.push(db.collection(`videos/${slug}/fotos`).onSnapshot(q=>{st.fotos={}; q.docs.forEach(d=>st.fotos[d.id]=d.data()); refresh()}));
  if(LOCAL) LOCAL.status(slug).then(r=>{if(r.running){st.job={slug,open:false};poll()}}).catch(()=>{});
}
(async()=>{
  const timer=setTimeout(()=>{if(!db) M.innerHTML='<div class="empty">O arquivo não respondeu. Abra o Estúdio no app do Claude, com sua conta.</div>'},10000);
  db=await claude.use('db'); assets=await claude.use('assets'); clearTimeout(timer);
  if(!db){M.innerHTML='<div class="empty">O arquivo do canal não abriu. No app do Claude, entre com sua conta; na versão local, confira se o servidor está rodando.</div>';return}
  db.doc('config/studio').onSnapshot(sn=>{st.config=sn.exists?sn.data():{}; if(st.tab==='cenas'&&!editing()&&st.video) rerenderEditor()});
  db.collection('videos').onSnapshot(q=>{st.videos=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||String(b.archive||'').localeCompare(String(a.archive||'')));
    $('#vsel').innerHTML=st.videos.map(v=>`<option value="${esc(v.id)}">${esc(v.title||v.id)}</option>`).join('');
    let want=null; try{want=localStorage.getItem('popdocs-video')}catch(e){}
    if(!st.slug&&st.videos.length){const v=st.videos.find(x=>x.id===want)||st.videos[0]; $('#vsel').value=v.id; openVideo(v.id)} else if(st.slug) $('#vsel').value=st.slug; if(!st.videos.length) view()},
    e=>{M.innerHTML=`<div class="empty">Não consegui abrir o arquivo (${esc(e.code)}).</div>`});
  stats();
})();
</script>
