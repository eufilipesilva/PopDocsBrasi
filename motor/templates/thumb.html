<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}:root{--bg:#0B0B0B;--fg:#F2F2F2;--ac:#F2F2F2}body{margin:0;background:var(--bg)}
#t{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--bg);color:var(--fg)}
.ph{position:absolute;left:0;top:0;width:640px;height:720px;background:center 20%/cover;filter:contrast(1.15)}
.fade{position:absolute;left:380px;top:0;width:300px;height:720px;background:linear-gradient(90deg,transparent,var(--bg) 85%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 40%,rgba(0,0,0,0),rgba(0,0,0,.5) 80%)}
.r{position:absolute;left:560px;right:48px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.k{font-family:'IBM Plex Mono';font-weight:500;font-size:26px;letter-spacing:5px;color:color-mix(in srgb,var(--ac) 62%,var(--bg))}
.big{font-family:'Oswald';font-weight:700;font-size:150px;line-height:1.12;letter-spacing:2px;margin:6px 0 18px}
.band{align-self:flex-start;background:var(--ac);color:var(--bg);font-family:'Oswald';font-weight:700;font-size:54px;line-height:1;padding:12px 22px 14px;text-transform:uppercase;transform:rotate(-1.5deg)}
.pd{position:absolute;right:40px;top:34px;font-family:'Oswald';font-weight:700;font-size:40px;border:4px solid var(--fg);padding:0 10px;line-height:1.3}
.stamp{position:absolute;right:48px;bottom:40px;font-family:'IBM Plex Mono';font-weight:500;font-size:22px;letter-spacing:4px;color:var(--bg);background:color-mix(in srgb,var(--ac) 40%,#A8A8A8);padding:6px 14px}
</style></head><body><div id="t">
<div class="ph" id="ph"></div><div class="fade"></div><div class="vig"></div>
<div class="pd">PD</div>
<div class="r"><div class="k" id="k"></div><div class="big" id="big"></div><div class="band" id="band"></div></div>
<div class="stamp" id="stamp"></div>
</div><script>window.setT=T=>{const C=T.cores||{},r=document.documentElement.style;r.setProperty('--bg',C.fundo||'#0B0B0B');r.setProperty('--fg',C.texto||'#F2F2F2');r.setProperty('--ac',C.destaque||C.texto||'#F2F2F2');document.getElementById('ph').style.backgroundImage='url('+T.photo+')';document.getElementById('ph').style.backgroundPosition=T.pos||'center 20%';
k.textContent=T.kick||'';big.textContent=T.title||'';big.style.fontSize=(T.size||150)+'px';band.textContent=T.band||'';stamp.textContent=T.stamp||'';stamp.style.display=T.stamp?'':'none';}</script></body></html>
